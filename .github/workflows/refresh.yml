name: Refresh whale scorecards

# GitHub Pages cannot run a server, so Actions IS the backend. This job does the
# expensive part -- ~3 API calls per wallet, ~280 wallets -- and commits compact
# JSON that the static page just renders. The live trade tape does not come
# through here; the browser opens its own websocket for that.

on:
  schedule:
    # Every 15 minutes. The scorecards barely move at that cadence, but the
    # screened-whale trade feed does -- and for visitors whose own network
    # cannot reach Polymarket, this job IS their live feed.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      top:
        description: 'Rows per leaderboard view'
        default: '60'
      discover:
        description: 'Scan market holders for off-leaderboard wallets'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/refresh.yml']

permissions:
  contents: write

concurrency:
  group: refresh
  # Cancel an older in-flight run rather than queueing behind it. Each run
  # regenerates the data from scratch, so a superseded run has nothing worth
  # finishing, and queued runs race each other to push.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build scorecards
        working-directory: pipeline
        run: |
          python -m pm.build \
            --top "${{ github.event.inputs.top || 60 }}" \
            --workers 8 \
            --out ../docs/data \
            ${{ github.event.inputs.discover == 'false' && '--no-discover' || '' }}

      - name: Sanity-check the output
        run: |
          python - <<'PY'
          import json, sys
          w = json.load(open('docs/data/whales.json', encoding='utf-8'))
          m = json.load(open('docs/data/meta.json', encoding='utf-8'))
          # Refuse to publish a broken build. A partial API outage would
          # otherwise silently replace a good board with a near-empty one.
          assert len(w) >= 50, f'only {len(w)} wallets scored -- refusing to publish'
          assert m['rankable'] >= 10, f"only {m['rankable']} rankable"
          assert any(c['verdict'] != 'INSUFFICIENT' for c in w), 'all insufficient'
          import os
          if os.path.exists('docs/data/whale_trades.json'):
              f = json.load(open('docs/data/whale_trades.json', encoding='utf-8'))
              print(f"feed: {len(f['trades'])} fills from {f['whales']} screened whales")
          print(f"OK: {len(w)} wallets, {m['rankable']} rankable, {m['verdicts']}")
          PY

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data
          if git diff --staged --quiet; then
            echo 'no change'
            exit 0
          fi
          git commit -m "data: refresh scorecards ($(date -u +%Y-%m-%dT%H:%MZ))"

          # Push with rebase-retry. Two runs overlapping (a schedule tick landing
          # on a push, or a manual dispatch) previously lost one to
          # "! [rejected] main -> main (fetch first)" -- the build succeeded and
          # the data was simply thrown away. Only docs/data is ever touched here
          # and each run regenerates it wholesale, so preferring our side on a
          # conflict is always correct.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git fetch origin main
            git rebase -X ours origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
