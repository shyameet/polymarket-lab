name: Paper funds

# The two $1,000 paper funds (pipeline/pm/fund.py) on their own: read the whale
# trades since the last run and replay them, nothing else -- about a minute.
# The Cloudflare timer in scheduler/ dispatches this every 15 minutes once its
# token is installed. GitHub's own schedule below is only a fallback: it fires
# every few hours, not when asked. The full scorecard rebuild (refresh.yml)
# runs with --no-fund, so the two jobs never write the same files.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/pm/fund.py', '.github/workflows/fund.yml']

permissions:
  contents: write

concurrency:
  group: fund
  # Never cancel: a run that is replaying should finish and save its place.
  cancel-in-progress: false

jobs:
  fund:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The newest book, not the commit that was current when this run was
          # queued: a queued run must start from the previous run's saved state.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replay the whales' trades through the paper funds
        working-directory: pipeline
        run: python -m pm.fund --cards ../docs/data/whales.json --out ../docs/data/fund --workers 8

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/fund
          if git diff --staged --quiet; then
            echo 'no change'
            exit 0
          fi
          git commit -m "data: paper funds ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Only this job writes docs/data/fund, and runs never overlap, so a
          # rejected push is a refresh.yml commit to other files: rebase cleanly.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
